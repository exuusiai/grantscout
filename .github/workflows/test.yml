name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        env:
          GRANTSCOUT_USE_MODEL_REASONING: "false"
          GRANTSCOUT_RETRIEVAL_MODE: lexical
        run: python -m pytest -q
