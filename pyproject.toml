[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperscout"
version = "0.1.0"
description = "Evidence-driven research literature review agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pymupdf>=1.24,<2",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "typer>=0.12,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
retrieval = [
    "faiss-cpu>=1.8,<2",
    "numpy>=1.26,<3",
    "sentence-transformers>=3,<6",
]
model = [
    "vllm>=0.6,<1",
]

[project.scripts]
paperscout = "paperscout.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"paperscout.api" = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
