<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaperScout</title>
<style>
:root{color:#172033;background:#f7fafc;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0}main{max-width:1440px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #cbd5e1;padding-bottom:16px}h1{font-size:24px;margin:0}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px}.header-actions{display:flex;align-items:center;gap:12px}.status,.empty{color:#64748b;font-size:14px}.question{display:grid;grid-template-columns:1fr 170px auto;gap:12px;padding:20px 0;border-bottom:1px solid #cbd5e1}textarea{width:100%;min-height:92px;resize:vertical;border:1px solid #94a3b8;border-radius:4px;padding:12px;font:inherit;background:#fff}select{align-self:end;height:42px;border:1px solid #94a3b8;border-radius:4px;padding:0 10px;background:#fff;font:inherit}button{align-self:end;border:1px solid #0f766e;background:#0f766e;color:#fff;border-radius:4px;padding:10px 16px;font:inherit;cursor:pointer;min-width:112px}button:disabled{background:#94a3b8;border-color:#94a3b8;cursor:wait}.language{min-width:40px;padding:6px 9px;background:#fff;color:#0f766e}.workspace{display:grid;grid-template-columns:minmax(250px,.8fr) minmax(280px,1fr) minmax(360px,1.7fr);gap:24px;padding-top:24px}.panel{min-width:0}.panel+.panel{border-left:1px solid #cbd5e1;padding-left:24px}.timeline{height:420px;overflow-y:auto;overscroll-behavior:contain;border:1px solid #cbd5e1;background:#fff;padding:0 12px}.timeline,.list{list-style:none;margin:0}.list{padding:0}.timeline li,.list li{padding:10px 0;border-bottom:1px solid #e2e8f0;font-size:14px}.timeline li:last-child{border-bottom:0}.timeline .error{color:#b91c1c}.timeline time{display:block;color:#64748b;font-size:12px}.tool-detail{color:#64748b;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.audit{margin-top:20px;border-top:1px solid #cbd5e1;padding-top:16px}.warning{color:#9a3412}.running{color:#0f766e;font-weight:600}.report{min-height:560px;overflow-wrap:anywhere;margin:0;padding:18px;background:#fff;border:1px solid #cbd5e1;border-radius:4px;font-size:14px;line-height:1.65}.report h1{font-size:22px;margin:0 0 20px}.report h2{font-size:17px;margin:26px 0 10px;border-bottom:1px solid #e2e8f0;padding-bottom:6px}.report ul{padding-left:22px}.report li{margin:6px 0}.report table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}.report th,.report td{border:1px solid #cbd5e1;padding:8px;text-align:left;vertical-align:top}.report th{background:#f1f5f9}.report code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.report a{color:#0369a1}@media(max-width:980px){.workspace{grid-template-columns:1fr 1fr}.report-panel{grid-column:1/-1}.panel+.panel{border-left:0;padding-left:0}}@media(max-width:640px){main{padding:16px}.question,.workspace{grid-template-columns:1fr}.report-panel{grid-column:auto}.panel+.panel{border-left:0;border-top:1px solid #cbd5e1;padding:20px 0 0}.timeline{height:300px}.report{min-height:360px}}
</style></head><body><main>
<header><h1 id="app-title">PaperScout 论文侦察</h1><div class="header-actions"><span id="status" class="status">就绪</span><button id="language" class="language" type="button" title="切换至英文">EN</button></div></header>
<section class="question"><textarea id="question" aria-label="研究问题" placeholder="输入研究问题，例如：查找 GRPO 相关论文"></textarea><select id="source" aria-label="数据源"><option id="source-arxiv" value="arxiv" selected>arXiv（优先）</option><option id="source-local" value="local">本地 SciFact</option></select><button id="run" type="button">开始综述</button></section>
<section class="workspace"><section class="panel"><h2 id="timeline-title">运行进度</h2><ol id="timeline" class="timeline"><li class="empty">尚未开始任务。</li></ol></section>
<section class="panel"><h2 id="evidence-title">选定证据</h2><ul id="evidence" class="list"><li class="empty">尚未选定证据。</li></ul><section class="audit"><h2 id="audit-title">引用审计</h2><div id="audit" class="empty">尚未完成审计。</div></section><section class="audit"><h2 id="warnings-title">提示</h2><ul id="warnings" class="list"><li class="empty">暂无提示。</li></ul></section></section>
<section class="panel report-panel"><h2 id="report-title">最终报告</h2><article id="report" class="report"><p class="empty">开始综述后，这里将显示可追溯报告。</p></article></section></section>
</main><script>
const q=s=>document.querySelector(s),question=q('#question'),source=q('#source'),run=q('#run'),language=q('#language'),status=q('#status'),timeline=q('#timeline'),evidence=q('#evidence'),audit=q('#audit'),warnings=q('#warnings'),report=q('#report');let locale='zh',terminalEvent=false,runState='ready';
const copy={zh:{appTitle:'PaperScout 论文侦察',timelineTitle:'运行进度',evidenceTitle:'选定证据',auditTitle:'引用审计',warningsTitle:'提示',reportTitle:'最终报告',languageTitle:'切换至英文',questionLabel:'研究问题',sourceLabel:'数据源',sourceArxiv:'arXiv（优先）',sourceLocal:'本地 SciFact',placeholder:'输入研究问题，例如：查找 GRPO 相关论文',ready:'就绪',run:'开始综述',running:'正在分析，请稍候…',starting:'正在连接分析服务…',arxivStarting:'正在查询 arXiv 官方数据源…',localStarting:'正在读取本地语料库…',arxivDone:'arXiv 已导入 {count} 篇论文',localDone:'本地语料库已加载 {count} 篇论文',emptyTimeline:'尚未开始任务。',emptyEvidence:'尚未选定证据。',emptyWarnings:'暂无提示。',waitingAudit:'等待引用审计…',disabledAudit:'引用审计未启用。',noEvidence:'没有选出匹配证据。',failed:'运行失败',completed:'已完成',question:'请输入至少 3 个字符的研究问题。',closed:'分析连接提前结束，请重试。',report:'开始综述后，这里将显示可追溯报告。',supported:'有支持',needsReview:'需复核'},en:{appTitle:'PaperScout',timelineTitle:'Timeline',evidenceTitle:'Selected evidence',auditTitle:'Citation audit',warningsTitle:'Warnings',reportTitle:'Final report',languageTitle:'Switch to Chinese',questionLabel:'Research question',sourceLabel:'Source',sourceArxiv:'arXiv (primary)',sourceLocal:'Local SciFact',placeholder:'Ask a research question, for example: Find papers about GRPO',ready:'Ready',run:'Run review',running:'Analyzing…',starting:'Connecting to analysis service…',arxivStarting:'Querying the official arXiv source…',localStarting:'Reading the local corpus…',arxivDone:'Imported {count} papers from arXiv',localDone:'Loaded {count} local papers',emptyTimeline:'No run started.',emptyEvidence:'No evidence selected.',emptyWarnings:'No warnings.',waitingAudit:'Waiting for citation audit…',disabledAudit:'Citation audit disabled.',noEvidence:'No matching evidence was selected.',failed:'Failed',completed:'Completed',question:'Enter a research question of at least 3 characters.',closed:'The analysis stream ended early. Please retry.',report:'Run a review to generate a traceable report.',supported:'supported',needsReview:'needs review'}};const t=k=>copy[locale][k],fill=(k,n)=>t(k).replace('{count}',n);
function clear(n){n.textContent=''}function item(n,text,kind=''){const li=document.createElement('li');li.textContent=text;if(kind)li.className=kind;n.append(li)}function formatTime(v){return v?new Date(v).toLocaleTimeString(locale==='zh'?'zh-CN':'en'):'now'}
const toolCopy={zh:{plan_question:'理解研究问题',model_decompose_question:'拆解检索问题',search_papers:'筛选相关论文',retrieve_evidence:'提取论文证据',model_extract_structured_facts:'分析论文发现',extract_structured_facts:'整理论文发现'},en:{plan_question:'Understand question',model_decompose_question:'Plan search queries',search_papers:'Rank relevant papers',retrieve_evidence:'Retrieve paper evidence',model_extract_structured_facts:'Analyze paper findings',extract_structured_facts:'Structure paper findings'}};
function addTool(call){if(timeline.querySelector('.empty'))clear(timeline);const li=document.createElement('li');li.className=call.status==='error'?'error':'';const time=document.createElement('time');time.textContent=formatTime(call.timestamp);const title=document.createElement('strong');title.textContent=toolCopy[locale][call.tool]||call.tool;const detail=document.createElement('div');detail.className='tool-detail';detail.textContent=call.input.paper_id||call.input.query||call.input.question||'';li.append(time,title,detail);timeline.append(li);timeline.scrollTop=timeline.scrollHeight}
function renderState(state){clear(evidence);const papers=new Map(state.selected_papers.map(p=>[p.id,p.title]));if(state.evidence_items.length){for(const row of state.evidence_items)item(evidence,(papers.get(row.paper_id)||row.paper_id)+' · '+row.id)}else item(evidence,t('noEvidence'),'empty');const c=state.citation_audit;audit.textContent=c?c.status+' · '+c.supported_claims+' '+t('supported')+' · '+c.unsupported_claims+' '+t('needsReview'):t('disabledAudit');clear(warnings);if(state.warnings.length){for(const warning of state.warnings)item(warnings,warning,'warning')}else item(warnings,t('emptyWarnings'),'empty')}
function handleEvent(event){if(event.type==='started'){runState='running';status.textContent=t('running')}if(event.type==='source_started')item(timeline,t(event.source==='arxiv'?'arxivStarting':'localStarting'),'running');if(event.type==='source_completed')item(timeline,event.warning||fill(event.source==='arxiv'?'arxivDone':'localDone',event.imported),event.warning?'warning':'');if(event.type==='tool_call')addTool(event.tool_call);if(event.type==='completed'){terminalEvent=true;runState='completed';status.textContent=t('completed');status.className='status';renderState(event.state);report.innerHTML=event.report_fragment}if(event.type==='error'){terminalEvent=true;runState='failed';status.textContent=t('failed');status.className='status';item(timeline,event.message,'error')}}
async function runReview(){const value=question.value.trim();if(value.length<3){status.textContent=t('question');question.focus();return}terminalEvent=false;runState='running';run.disabled=true;source.disabled=true;run.textContent=t('running');status.textContent=t('starting');status.className='status running';clear(timeline);item(timeline,t('starting'),'running');clear(evidence);item(evidence,t('running'),'empty');clear(warnings);item(warnings,t('emptyWarnings'),'empty');audit.textContent=t('waitingAudit');report.textContent=t('running');try{const response=await fetch('/api/ask/stream',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','Accept':'application/x-ndjson'},body:JSON.stringify({question:value,source:source.value,locale})});if(!response.ok){let message='Request failed';try{message=(await response.json()).detail||message}catch{}throw new Error(message)}if(!response.body)throw new Error('Streaming response is unavailable');const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const chunk=await reader.read();buffer+=decoder.decode(chunk.value||new Uint8Array(),{stream:!chunk.done});const lines=buffer.split('\n');buffer=lines.pop()||'';for(const line of lines)if(line.trim())handleEvent(JSON.parse(line));if(chunk.done)break}if(buffer.trim())handleEvent(JSON.parse(buffer));if(!terminalEvent)throw new Error(t('closed'))}catch(error){runState='failed';status.textContent=t('failed');status.className='status';item(timeline,error instanceof Error?error.message:String(error),'error')}finally{run.disabled=false;source.disabled=false;run.textContent=t('run')}}
function setLocale(next){locale=next;document.documentElement.lang=locale==='zh'?'zh-CN':'en';language.textContent=locale==='zh'?'EN':'中';language.title=t('languageTitle');q('#app-title').textContent=t('appTitle');q('#timeline-title').textContent=t('timelineTitle');q('#evidence-title').textContent=t('evidenceTitle');q('#audit-title').textContent=t('auditTitle');q('#warnings-title').textContent=t('warningsTitle');q('#report-title').textContent=t('reportTitle');q('#source-arxiv').textContent=t('sourceArxiv');q('#source-local').textContent=t('sourceLocal');question.placeholder=t('placeholder');question.setAttribute('aria-label',t('questionLabel'));source.setAttribute('aria-label',t('sourceLabel'));run.textContent=run.disabled?t('running'):t('run');status.textContent=t(runState);if(runState==='ready'){timeline.querySelector('.empty').textContent=t('emptyTimeline');evidence.querySelector('.empty').textContent=t('emptyEvidence');warnings.querySelector('.empty').textContent=t('emptyWarnings');audit.textContent=t('disabledAudit');report.innerHTML='<p class="empty">'+t('report')+'</p>'}}
language.addEventListener('click',()=>setLocale(locale==='zh'?'en':'zh'));run.addEventListener('click',runReview);question.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key==='Enter')runReview()});
</script></body></html>
