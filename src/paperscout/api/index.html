</style></head><body><main>
<header><h1 id="app-title">PaperScout 论文侦察</h1><div class="header-actions"><span id="status" class="status">就绪</span><button id="language" class="language" type="button" title="切换至英文">EN</button></div></header>
<section class="agent"><h2 id="agent-title">研究需求对话</h2><div id="chat-log" class="chat-log"><div id="welcome" class="message">请描述你想研究的问题；遇到简称或歧义时，我会先向你确认。</div></div><div class="chat-compose"><input id="question" type="search" aria-label="对话输入" placeholder="输入研究需求或补充反馈"><button id="send" type="button">发送</button></div></section><details class="knowledge"><summary>项目知识库管理</summary><div class="knowledge-body"><div><input id="project-name" placeholder="新项目名称"><button id="create-project" type="button">创建</button><select id="project"><option value="">选择项目</option></select></div><label id="drop-zone">拖放或选择 MD、PDF、PPTX 文件<input id="files" type="file" multiple accept=".md,.markdown,.pdf,.pptx,.txt"></label><ul id="upload-list"></ul></div></details><section class="controls"><select id="source" aria-label="数据源"><option id="source-arxiv" value="arxiv" selected>arXiv（优先）</option><option id="source-project" value="project">项目知识库</option><option id="source-local" value="local">本地 SciFact</option></select><select id="ranking" aria-label="排序方式"><option id="ranking-auto" value="auto" selected>自动排序</option><option id="ranking-relevance" value="relevance">相关度优先</option><option id="ranking-recent" value="recent">时间优先</option><option id="ranking-citations" value="citations">引用量优先</option></select><button id="run" type="button" disabled>重新生成</button></section>
<section class="workspace"><aside class="side-stack"><section class="panel side-panel"><h2 id="timeline-title">运行进度</h2><ol id="timeline" class="timeline"><li class="empty">尚未开始任务。</li></ol></section>
<section class="panel side-panel evidence-panel"><h2 id="evidence-title">选定证据</h2><ul id="evidence" class="list"><li class="empty">尚未选定证据。</li></ul><section class="audit"><h2 id="audit-title">引用审计</h2><div id="audit" class="empty">尚未完成审计。</div></section><section class="audit"><h2 id="warnings-title">提示</h2><ul id="warnings" class="list"><li class="empty">暂无提示。</li></ul></section></section></aside>
<section class="panel report-panel"><div class="report-actions"><h2 id="report-title">最终报告</h2><button id="export" class="export" type="button" disabled>导出 PDF</button></div><div class="report-scroll"><section id="recommendations" class="recommendations" hidden><h2 id="recommendations-title">推荐阅读</h2><ol id="recommendation-list"></ol></section><article id="report" class="report"><p class="empty">开始综述后，这里将显示研究笔记。</p></article></div></section></section>
</main><script>
const q=s=>document.querySelector(s),question=q('#question'),send=q('#send'),chatLog=q('#chat-log'),source=q('#source'),ranking=q('#ranking'),run=q('#run'),language=q('#language'),status=q('#status'),timeline=q('#timeline'),evidence=q('#evidence'),audit=q('#audit'),warnings=q('#warnings'),report=q('#report'),exportButton=q('#export'),recommendations=q('#recommendations'),recommendationList=q('#recommendation-list'),project=q('#project'),files=q('#files'),uploadList=q('#upload-list');let locale='zh',terminalEvent=false,runState='ready',reportFragments=null,latestPapers=[],messages=[],resolvedQuestion=null;
const copy={zh:{appTitle:'PaperScout 论文侦察',agentTitle:'研究需求对话',welcome:'请描述你想研究的问题；遇到简称或歧义时，我会先向你确认。',send:'发送',chatting:'理解中…',timelineTitle:'运行进度',evidenceTitle:'选定证据',auditTitle:'引用审计',warningsTitle:'提示',reportTitle:'最终报告',recommendationsTitle:'推荐阅读',exportPdf:'导出 PDF',languageTitle:'切换至英文',questionLabel:'对话输入',sourceLabel:'数据源',rankingLabel:'排序方式',sourceArxiv:'arXiv（优先）',sourceLocal:'本地 SciFact',rankingAuto:'自动排序',rankingRelevance:'相关度优先',rankingRecent:'时间优先',rankingCitations:'引用量优先',placeholder:'输入研究需求或补充反馈',ready:'就绪',run:'开始综述',running:'正在分析，请稍候…',starting:'正在连接分析服务…',arxivStarting:'正在查询 arXiv 官方数据源…',localStarting:'正在读取本地语料库…',arxivDone:'arXiv 已导入 {count} 篇论文',localDone:'本地语料库已加载 {count} 篇论文',emptyTimeline:'尚未开始任务。',emptyEvidence:'尚未选定证据。',emptyWarnings:'暂无提示。',waitingAudit:'等待引用审计…',disabledAudit:'引用审计未启用。',noEvidence:'没有选出匹配证据。',failed:'运行失败',completed:'已完成',question:'请输入至少 3 个字符。',closed:'分析连接提前结束，请重试。',report:'开始综述后，这里将显示研究笔记。',supported:'有支持',needsReview:'需复核'},en:{appTitle:'PaperScout',agentTitle:'Research conversation',welcome:'Describe your research need. I will clarify ambiguous terms before searching.',send:'Send',chatting:'Understanding…',timelineTitle:'Timeline',evidenceTitle:'Selected evidence',auditTitle:'Citation audit',warningsTitle:'Warnings',reportTitle:'Final report',recommendationsTitle:'Recommended reading',exportPdf:'Export PDF',languageTitle:'Switch to Chinese',questionLabel:'Chat input',sourceLabel:'Source',rankingLabel:'Ranking',sourceArxiv:'arXiv (primary)',sourceLocal:'Local SciFact',rankingAuto:'Automatic',rankingRelevance:'Relevance first',rankingRecent:'Newest first',rankingCitations:'Most cited first',placeholder:'Enter a research request or feedback',ready:'Ready',run:'Run review',running:'Analyzing…',starting:'Connecting to analysis service…',arxivStarting:'Querying the official arXiv source…',localStarting:'Reading the local corpus…',arxivDone:'Imported {count} papers from arXiv',localDone:'Loaded {count} local papers',emptyTimeline:'No run started.',emptyEvidence:'No evidence selected.',emptyWarnings:'No warnings.',waitingAudit:'Waiting for citation audit…',disabledAudit:'Citation audit disabled.',noEvidence:'No matching evidence was selected.',failed:'Failed',completed:'Completed',question:'Enter at least 3 characters.',closed:'The analysis stream ended early. Please retry.',report:'Run a review to generate a research note.',supported:'supported',needsReview:'needs review'}};const t=k=>copy[locale][k],fill=(k,n)=>t(k).replace('{count}',n);
Object.assign(copy.zh,{run:'重新生成',autoStarting:'已理解需求，正在自动生成…',selectProject:'选择项目',sourceProject:'项目知识库',selectProjectFirst:'请先选择项目。',creatingProject:'正在创建项目…',projectCreated:'项目已创建，已切换到项目知识库。',uploadQueued:'文件已进入解析队列。',knowledgeReady:'知识库已更新。',operationFailed:'操作失败'});Object.assign(copy.en,{run:'Regenerate',autoStarting:'Request understood. Generating automatically…',selectProject:'Select project',sourceProject:'Project knowledge base',selectProjectFirst:'Select a project first.',creatingProject:'Creating project…',projectCreated:'Project created. Project knowledge base selected.',uploadQueued:'Files queued for parsing.',knowledgeReady:'Knowledge base updated.',operationFailed:'Operation failed'});
function clear(n){n.textContent=''}function item(n,text,kind=''){const li=document.createElement('li');li.textContent=text;if(kind)li.className=kind;n.append(li)}function formatTime(v){return v?new Date(v).toLocaleTimeString(locale==='zh'?'zh-CN':'en'):'now'}
const toolCopy={zh:{plan_question:'理解研究问题',model_decompose_question:'拆解检索问题',search_papers:'筛选相关论文',retrieve_evidence:'提取论文证据',model_extract_structured_facts:'分析论文发现',extract_structured_facts:'整理论文发现',model_synthesize_findings:'综合主要发现'},en:{plan_question:'Understand question',model_decompose_question:'Plan search queries',search_papers:'Rank relevant papers',retrieve_evidence:'Retrieve paper evidence',model_extract_structured_facts:'Analyze paper findings',extract_structured_facts:'Structure paper findings',model_synthesize_findings:'Synthesize main findings'}};
function addTool(call){if(timeline.querySelector('.empty'))clear(timeline);const li=document.createElement('li');li.className=call.status==='error'?'error':'';const time=document.createElement('time');time.textContent=formatTime(call.timestamp);const title=document.createElement('strong');title.textContent=toolCopy[locale][call.tool]||call.tool;const detail=document.createElement('div');detail.className='tool-detail';detail.textContent=call.input.paper_id||call.input.query||call.input.question||'';li.append(time,title,detail);timeline.append(li);timeline.scrollTop=timeline.scrollHeight}
function renderState(state){clear(evidence);const papers=new Map(state.selected_papers.map(p=>[p.id,p.title]));if(state.evidence_items.length){for(const row of state.evidence_items)item(evidence,(papers.get(row.paper_id)||row.paper_id)+' · '+row.id)}else item(evidence,t('noEvidence'),'empty');const c=state.citation_audit;audit.textContent=c?c.status+' · '+c.supported_claims+' '+t('supported')+' · '+c.unsupported_claims+' '+t('needsReview'):t('disabledAudit');clear(warnings);if(state.warnings.length){for(const warning of state.warnings)item(warnings,warning,'warning')}else item(warnings,t('emptyWarnings'),'empty')}
function pdfUrl(path){if(!path||!path.includes('arxiv.org/abs/'))return path||'#';return path.replace('/abs/','/pdf/').replace(/\.pdf$/,'')+'.pdf'}
function renderRecommendations(){clear(recommendationList);for(const paper of latestPapers.slice(0,3)){const li=document.createElement('li'),link=document.createElement('a');link.textContent=paper.title+(paper.year?' ('+paper.year+')':'');link.href=pdfUrl(paper.source_path);link.target='_blank';link.rel='noopener';li.append(link);recommendationList.append(li)}recommendations.hidden=!recommendationList.children.length}
function addMessage(role,content){const node=document.createElement('div');node.className='message '+role;node.textContent=content;chatLog.append(node);chatLog.scrollTop=chatLog.scrollHeight}
async function jsonRequest(url,options){const response=await fetch(url,options);let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.detail||response.statusText||t('operationFailed'));return data}async function loadProjects(){try{const selected=project.value,rows=await jsonRequest('/api/projects');project.replaceChildren(new Option(t('selectProject'),''));for(const row of rows)project.add(new Option(row.name,row.id));project.value=selected}catch(error){status.textContent=error.message||t('operationFailed')}}async function createProject(){const name=q('#project-name').value.trim(),button=q('#create-project');if(!name){q('#project-name').focus();return}button.disabled=true;status.textContent=t('creatingProject');try{const row=await jsonRequest('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});await loadProjects();project.value=row.id;source.value='project';q('#project-name').value='';status.textContent=t('projectCreated')}catch(error){status.textContent=error.message||t('operationFailed')}finally{button.disabled=false}}async function upload(selected){if(!project.value){status.textContent=t('selectProjectFirst');project.focus();return}if(!selected.length)return;const body=new FormData();body.append('project_id',project.value);for(const file of selected)body.append('files',file);source.value='project';status.textContent=t('uploadQueued');try{const tasks=await jsonRequest('/api/knowledge/upload',{method:'POST',body});await watchUploads(tasks.map(task=>task.id))}catch(error){status.textContent=error.message||t('operationFailed')}}async function watchUploads(ids){for(let turn=0;turn<300;turn++){const tasks=await Promise.all(ids.map(id=>jsonRequest('/api/knowledge/tasks/'+id)));uploadList.replaceChildren(...tasks.map(task=>{const li=document.createElement('li');li.textContent=task.name+' · '+task.status+' · '+task.progress+'%'+(task.error?' · '+task.error:'');return li}));if(tasks.every(task=>['ready','failed'].includes(task.status))){status.textContent=tasks.some(task=>task.status==='failed')?t('operationFailed'):t('knowledgeReady');break}await new Promise(resolve=>setTimeout(resolve,1000))}}
async function sendMessage(){const value=question.value.trim();if(value.length<3){status.textContent=t('question');question.focus();return}messages.push({role:'user',content:value});addMessage('user',value);question.value='';resolvedQuestion=null;run.disabled=true;send.disabled=true;send.textContent=t('chatting');status.textContent=t('chatting');try{const result=await jsonRequest('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,locale})});messages.push({role:'assistant',content:result.message});addMessage('assistant',result.message);if(result.status==='ready'){resolvedQuestion=result.refined_question;ranking.value=result.ranking;status.textContent=t('autoStarting');setTimeout(runReview,0)}else status.textContent=t('ready')}catch(error){addMessage('assistant',error instanceof Error?error.message:String(error));status.textContent=t('failed')}finally{send.disabled=false;send.textContent=t('send');question.focus()}}
function handleEvent(event){if(event.type==='started'){runState='running';status.textContent=t('running')}if(event.type==='source_started')item(timeline,t(event.source==='arxiv'?'arxivStarting':'localStarting'),'running');if(event.type==='source_completed')item(timeline,event.warning||fill(event.source==='arxiv'?'arxivDone':'localDone',event.imported),event.warning?'warning':'');if(event.type==='tool_call')addTool(event.tool_call);if(event.type==='completed'){terminalEvent=true;runState='completed';reportFragments=event.report_fragments;latestPapers=event.state.selected_papers||[];status.textContent=t('completed');status.className='status';renderState(event.state);renderRecommendations();exportButton.disabled=false;report.innerHTML=reportFragments?.[locale]||event.report_fragment}if(event.type==='error'){terminalEvent=true;runState='failed';status.textContent=t('failed');status.className='status';item(timeline,event.message,'error')}}
async function runReview(){const value=resolvedQuestion;if(!value)return;terminalEvent=false;runState='running';run.disabled=true;send.disabled=true;source.disabled=true;ranking.disabled=true;exportButton.disabled=true;recommendations.hidden=true;run.textContent=t('running');status.textContent=t('starting');status.className='status running';clear(timeline);item(timeline,t('starting'),'running');clear(evidence);item(evidence,t('running'),'empty');clear(warnings);item(warnings,t('emptyWarnings'),'empty');audit.textContent=t('waitingAudit');report.textContent=t('running');try{const response=await fetch('/api/ask/stream',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','Accept':'application/x-ndjson'},body:JSON.stringify({question:value,source:source.value,project_id:project.value||null,locale,ranking:ranking.value})});if(!response.ok){let message='Request failed';try{message=(await response.json()).detail||message}catch{}throw new Error(message)}if(!response.body)throw new Error('Streaming response is unavailable');const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const chunk=await reader.read();buffer+=decoder.decode(chunk.value||new Uint8Array(),{stream:!chunk.done});const lines=buffer.split('\n');buffer=lines.pop()||'';for(const line of lines)if(line.trim())handleEvent(JSON.parse(line));if(chunk.done)break}if(buffer.trim())handleEvent(JSON.parse(buffer));if(!terminalEvent)throw new Error(t('closed'))}catch(error){runState='failed';status.textContent=t('failed');status.className='status';item(timeline,error instanceof Error?error.message:String(error),'error')}finally{run.disabled=!resolvedQuestion;send.disabled=false;source.disabled=false;ranking.disabled=false;run.textContent=t('run')}}
function setLocale(next){locale=next;document.documentElement.lang=locale==='zh'?'zh-CN':'en';language.textContent=locale==='zh'?'EN':'中';language.title=t('languageTitle');q('#app-title').textContent=t('appTitle');q('#agent-title').textContent=t('agentTitle');q('#welcome').textContent=t('welcome');q('#timeline-title').textContent=t('timelineTitle');q('#evidence-title').textContent=t('evidenceTitle');q('#audit-title').textContent=t('auditTitle');q('#warnings-title').textContent=t('warningsTitle');q('#report-title').textContent=t('reportTitle');q('#recommendations-title').textContent=t('recommendationsTitle');exportButton.textContent=t('exportPdf');send.textContent=send.disabled?t('chatting'):t('send');q('#source-arxiv').textContent=t('sourceArxiv');q('#source-local').textContent=t('sourceLocal');q('#ranking-auto').textContent=t('rankingAuto');q('#ranking-relevance').textContent=t('rankingRelevance');q('#ranking-recent').textContent=t('rankingRecent');q('#ranking-citations').textContent=t('rankingCitations');question.placeholder=t('placeholder');question.setAttribute('aria-label',t('questionLabel'));source.setAttribute('aria-label',t('sourceLabel'));ranking.setAttribute('aria-label',t('rankingLabel'));run.textContent=runState==='running'?t('running'):t('run');status.textContent=t(runState);if(runState==='completed'&&reportFragments){report.innerHTML=reportFragments[locale];renderRecommendations()}if(runState==='ready'){timeline.querySelector('.empty').textContent=t('emptyTimeline');evidence.querySelector('.empty').textContent=t('emptyEvidence');warnings.querySelector('.empty').textContent=t('emptyWarnings');audit.textContent=t('disabledAudit');report.innerHTML='<p class="empty">'+t('report')+'</p>'}}
language.addEventListener('click',()=>setLocale(locale==='zh'?'en':'zh'));exportButton.addEventListener('click',()=>window.print());send.addEventListener('click',sendMessage);run.addEventListener('click',runReview);q('#create-project').addEventListener('click',createProject);project.addEventListener('change',()=>{if(project.value)source.value='project'});files.addEventListener('change',()=>upload(files.files));q('#drop-zone').addEventListener('dragover',event=>event.preventDefault());q('#drop-zone').addEventListener('drop',event=>{event.preventDefault();upload(event.dataTransfer.files)});question.addEventListener('input',()=>{run.disabled=true});question.addEventListener('keydown',event=>{if(event.key==='Enter')sendMessage()});loadProjects();
</script></body></html>
